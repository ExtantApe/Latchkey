# Latchkey settings. Every setting is checked at startup and on reload. If a setting
# isn't safe, the part it affects stays off and the console says what to change.
# There's no switch that skips a check.

# The address of the page players sign in to, starting with https://.
# Nothing is offered until this is set.
sign-in-page: ""

landing:
  # The web page itself. Off until you turn it on. Invites and sign-in each have their
  # own switch below, so the page can be up with either or both of them off.
  enabled: false
  # Where the page listens. Keep it on this machine and let your tunnel or proxy
  # reach it. Must be a loopback or private IP address.
  bind: 127.0.0.1
  port: 25680
  # The https:// address players open, from your tunnel or proxy. Its own host, such as
  # https://join.example.org, or a path on one, such as https://example.org/join. Under a
  # path, Latchkey answers only that path; have the proxy pass it on as it is.
  public-url: ""
  # Exact addresses of the tunnel agent or proxy in front of the page. Only these
  # are believed about a visitor's real address. No wildcards or wide ranges.
  trusted-proxies:
    - 127.0.0.1
  rate-limits:
    # Tries one visitor gets in 10 minutes. 1 to 20.
    per-ip-per-10-minutes: 10
    # Tries everyone together gets in a minute. 1 to 60.
    site-wide-per-minute: 30
  # Other pages on this machine to show under the same address, so a signed-in
  # player's browser reaches them. Loopback targets only. Latchkey's own paths, such
  # as /map and /invite, can't be used. For example:
  #   /wiki: http://127.0.0.1:8200
  # The web map has its own address instead, with Mapkeeper: see page.map-address.
  forward: {}
  # How often Latchkey checks that its page answers at public-url over HTTPS, from
  # outside, through your tunnel and proxy. Shown in /latchkey status. 0 turns it off.
  health-check-minutes: 5

# How the landing page looks, and what a player sees once their invite is used. All optional.
page:
  # The server's name at the top. Empty shows "Join the server".
  title: ""
  # A .png or .webp file in plugins/Latchkey/, at most 512 KB, such as logo.png. Empty shows no logo.
  logo: ""
  # The address players type into Minecraft. Shown only to a browser that has used its invite or signed in, never
  # on the page anyone can see.
  play-address: ""
  # The map's own https:// address, such as https://map.example.org, when Mapkeeper serves the server's web map
  # there. A signed-in player then gets an "Open the map" button that signs them in on the map too, once. Empty: no
  # button.
  map-address: ""
  # A few first steps, shown under the address. Up to 8, each a title and a line or two of text.
  steps:
    - title: "Accept the resource pack"
      text: "When you join, Minecraft asks to download the server's resource pack. Choose Yes: the server needs it, and you'll be disconnected without it."
    - title: "Where you start"
      text: "Your first join puts you in the server's starting area. Look around, then follow the signs."
invites:
  # Whether invited players can use their codes on the page. Off until you turn it on.
  # Admins can make invites only while this is on, so no code is handed out that can't work.
  enabled: false
  # How long a new invite code works. 1 to 30 days.
  lifetime-days: 14

sessions:
  # Whether players can sign a browser in, with /login or by using an invite. Off until
  # you turn it on. Signed-in browsers see the play address and the map button.
  enabled: false
  # How long a browser stays signed in. 1 to 720 hours (30 days).
  lifetime-hours: 24

lobby:
  # The world arriving players are sent to. The lobby is off until this is set.
  # Works with or without Multiverse: any loaded world will do.
  world: ""
  # Where in that world. Leave it out to use the world's own spawn.
  #   spawn: {x: 0.5, y: 65, z: 0.5, yaw: 0, pitch: 0}
  # Who is sent there when they join: first-join, always or never.
  send: first-join
  # With Rewild installed, tells it to leave the lobby alone: every chunk within this many chunks of its spawn. Rewild
  # listens once an admin respects Latchkey with /rewild plugins. Read at startup.
  rewild-keep: true
  rewild-keep-radius: 8
  # What a player sees the first time they join. Leave a line empty to skip it.
  welcome:
    title: "Welcome"
    subtitle: ""
    chat: []
