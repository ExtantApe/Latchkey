name: Latchkey
version: '${version}'
main: com.extantape.latchkey.LatchkeyPlugin
api-version: '26.1'
description: Signs a player's browser in with a one-time link, sent privately in game
# /signin is registered with Brigadier in onEnable. paper-plugin.yml has no commands section.
permissions:
  latchkey.signin:
    description: Ask for a sign-in link.
    default: op
